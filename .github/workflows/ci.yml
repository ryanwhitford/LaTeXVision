name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest -v
        # Tests that need the downloaded HASYv2 archive (see README) are
        # skipped automatically when data/raw/hasyv2_download is absent, so
        # this job intentionally doesn't fetch the ~35MB dataset.
