# Training configuration for src.training.train_classifier
# Any value here can be overridden with a matching --flag on the CLI.

dataset_config: configs/dataset.yaml

preprocessing:
  # Whether to crop to the ink bounding box (+ padding) before resizing.
  # MUST match what src/api/inference.py serves with -- it always applies
  # this transform's own content_crop setting via class_mapping.json, so
  # changing this here and retraining is sufficient; nothing else to sync.
  # See experiments/audit/AUDIT_REPORT.md, Finding 1.
  content_crop: true
  # Randomly thin/thicken strokes during training (train-only; doesn't
  # affect inference). Tried at p=0.3 in experiments/div_bias_investigation/
  # (exp2_stroke_width_aug in experiments/results.csv): fixed the targeted
  # thin/thick-stroke robustness gap but regressed overall clean accuracy
  # 97.87%->94.90%, a net loss -- rejected. Left here, off by default, as a
  # tested capability in case a future, better-tuned version is worth
  # revisiting (e.g. lower p, or erosion only).
  stroke_width_aug: false

data:
  batch_size: 64
  # HASYv2 (filtered) is small enough that macOS multiprocessing worker
  # spawn overhead dwarfs any parallel-loading benefit; keep this at 0
  # unless the dataset config grows substantially.
  num_workers: 0

model:
  architecture: simple_cnn
  dropout: 0.3
  use_batchnorm: true

training:
  epochs: 60
  learning_rate: 0.001
  weight_decay: 0.0001
  optimizer: adam
  # How to counter HASYv2's per-class imbalance (e.g. 'x': 46 train examples
  # vs '\infty': ~2000): "weighted_sampler" oversamples minority classes so
  # every class gets roughly equal exposure per epoch (recommended -- see
  # src/training/train_classifier.py); "class_weights" instead reweights the
  # loss and leaves sampling untouched; "none" disables both.
  balance_strategy: weighted_sampler
  seed: 42
  device: auto # auto | cpu | cuda | mps
  early_stopping_patience: 12

output:
  output_dir: models
  run_name: symbol_classifier_v1
