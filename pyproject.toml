[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "latexvision"
version = "0.1.0"
description = "Handwritten mathematical expression to LaTeX recognition"
requires-python = ">=3.11"
readme = "README.md"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
